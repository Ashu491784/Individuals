<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
          <a class="navbar-brand" href="#"><i class="bi bi-book"></i> 𝐍𝐞𝐰𝐬 𝐅𝐢𝐧𝐝𝐞𝐫</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <button class="nav-link btn btn-link" id="show-favorites"> <i class="bi bi-heart-fill"></i> Favorites</button>
                    </li>
                </ul>
            </div>
          </div>
        </div>
      </nav>

      <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow">
                    <div class="card-body p-5">
                        <h2 class="text-center mb-4">Find your need News Type</h2>
                        <div class="input-group mb-4">
                            <input type="text" class="form-control" id="search-input" placeholder="Search for laters News">
                            <button class="btn btn-danger" id="search-btn"><i class="bi bi-search-heart"></i> Search</button>
                        </div>
                        <div class="d-flex flex-wrap justify-content-center gap-2">
                            <button class="btn btn-outline-danger quick-search" data-query="sport">Sport</button>
                            <button class="btn btn-outline-danger quick-search" data-query="local">Local</button>
                            <button class="btn btn-outline-danger quick-search" data-query="bussiness">Bussiness</button>
                            <button class="btn btn-outline-danger quick-search" data-query="Iland">Iland</button>
                        </div>
                    </div>
                </div>
            </div>

        </div>
      </div>
      <div class="row mt-5" id="news-conteiner">
        <div class="col-12 text-center text-muted">
            <i class="bi bi-globe-americas display-4"></i>
            <h3 class="mt-3">Sᴇᴀʀᴄʜ ғᴏʀ Nᴇᴡs ɢᴇᴛ sᴛᴀʀᴛ</h3>
        </div>

      </div>
</body>
</html>
